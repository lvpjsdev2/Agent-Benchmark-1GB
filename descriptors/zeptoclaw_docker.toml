# ZeptoClaw docker: the official image is built without the `panel` feature, so the
# gateway (health server on 9090) is the entry point. Config is mounted read-only.
name = "ZeptoClaw"
repo_url = "https://github.com/qhkm/zeptoclaw"
version = "0.9.2"
mode = "docker"
image = "ghcr.io/qhkm/zeptoclaw@sha256:e32bce5650aae597a2d2ebda3d4c3d5cf2349f9354934691d263ac7414a6b86a"
start_command = ["zeptoclaw", "gateway"]
docker_args = [
  # The official entrypoint chowns its data directory before dropping to the
  # runtime user; this is narrower than privileged mode and required to boot.
  "--cap-add=CHOWN",
  "--cap-add=SETUID",
  "--cap-add=SETGID",
  "-p", "127.0.0.1:9090:9090",
  # The image entrypoint chowns /data before starting; read-only mounts make
  # the container exit before its health server is available.
  "-v", "/home/ubuntu/bench-config/zeptoclaw:/data/.zeptoclaw",
]
workdir = "/tmp/bench-wd/zeptoclaw_docker"

[healthcheck]
type = "http"
value = "http://127.0.0.1:9090/healthz"
timeout_sec = 60
