[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bench"
version = "0.1.0"
description = "Agent benchmark harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bench = "bench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]
